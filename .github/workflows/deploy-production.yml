name: Deploy to Production

# On push to `main`: run the full test gate, then deploy to PRODUCTION behind a
# manual approval gate (the `Production` GitHub Environment with Kevin as a
# required reviewer — this is the "ask before first prod deploy" control).
# Deploy = migrations + edge functions + EAS production build, then a release tag
# and a Slack summary. Failures alert Slack with a link to the run.
#
# Required reviewer setup (one-time): Settings → Environments → Production →
# "Required reviewers" → add yourself. Until then the deploy job auto-proceeds.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    name: Migrations + edge functions + EAS (production)
    needs: [test]
    runs-on: ubuntu-latest
    # Approval gate — pauses for the Production environment's required reviewer.
    environment: Production
    permissions:
      contents: write   # needed to push the release tag
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
      PROD_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the release tag is unambiguous

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not "latest") — resolving "latest" hits the GitHub API and
          # gets rate-limited on shared runners. Bump deliberately.
          version: 2.76.9

      - name: Link production project
        run: supabase link --project-ref "$PROD_REF"

      - name: Apply pending migrations
        run: supabase db push

      - name: Deploy edge functions
        # Retry up to 3× — `supabase functions deploy` fetches remote esm.sh
        # imports while bundling and esm.sh (Cloudflare) intermittently returns
        # 522/timeout, failing the non-atomic deploy mid-flight. Re-runs are
        # idempotent ("No change found" skips unchanged functions). See the
        # staging workflow for the same guard and docs/chief_engineer/deployment.md.
        run: |
          for attempt in 1 2 3; do
            echo "::group::functions deploy attempt $attempt"
            if supabase functions deploy --project-ref "$PROD_REF"; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "::warning::functions deploy attempt $attempt failed (likely transient esm.sh); retrying…"
            sleep 15
          done
          echo "::error::functions deploy failed after 3 attempts"; exit 1

      - name: Bootstrap curation — prod lands FULLY-SCORED (atomic with the deploy)
        # Runs the notability generator over the whole prod catalog + the blend INSIDE
        # the gated deploy, so prod launches fully-scored instead of schema-with-empty-
        # scores filling in via the hourly cron. Idempotent + cheap on re-deploys:
        # score-notability is source_signature-cached (already-scored items => scored=0
        # => the loop breaks on the first pass, ~no LLM spend). Prereqs verified present
        # on prod: app_config.service_role_key + ANTHROPIC_API_KEY.
        run: |
          PROD_URL="https://${PROD_REF}.supabase.co"
          # Service-role key from prod app_config (same key the score cron uses). Masked; never logged.
          KEY=$(curl -s -X POST "https://api.supabase.com/v1/projects/${PROD_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"query\":\"select value from app_config where key = 'service_role_key'\"}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(JSON.parse(d)[0].value)}catch{process.exit(1)}})")
          if [ -z "$KEY" ]; then echo "::error::could not read service_role_key from prod app_config"; exit 1; fi
          echo "::add-mask::$KEY"
          MGMT="https://api.supabase.com/v1/projects/${PROD_REF}/database/query"
          # 0. ONE-TIME corrected re-score (Wave 2 model-town fix). score-notability now
          #    judges each item by ITS OWN town; existing prod verdicts were cached under the
          #    buggy region-blind town, and force=false alone will NOT correct them. So on
          #    this promotion we clear the cached ACTIVITY verdicts for active regions once —
          #    the score loop below then re-scores them with corrected towns, and the blend
          #    recomputes carousels to match what was verified on staging. Guarded by an
          #    app_config marker so it runs ONLY on this promotion, never on later deploys
          #    (source_signature caching keeps those cheap). Clearing model_notability does
          #    NOT change live carousels — is_carousel_eligible/carousel_rank_score only flip
          #    when the blend re-runs at the end, so carousels transition old→corrected
          #    atomically at deploy-end, never empty mid-flight.
          RESCORE_MARK=$(curl -s -X POST "$MGMT" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"query\":\"select value from app_config where key = 'wave2_corrected_rescore_done'\"}" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const v=JSON.parse(d);process.stdout.write(v&&v[0]?String(v[0].value):'')}catch{process.stdout.write('')}})")
          if [ -z "$RESCORE_MARK" ]; then
            echo "One-time Wave-2 corrected re-score: clearing cached activity verdicts for active regions…"
            DEL=$(curl -s -X POST "$MGMT" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"query\":\"delete from model_notability mn using explore_items ei, region r where mn.item_id = ei.id and ei.region_id = r.id and r.is_active and ei.kind::text = 'activity'\"}" \
              -o /dev/null -w "%{http_code}")
            echo "clear cached activity verdicts: HTTP $DEL"
            [ "$DEL" -ge 400 ] && { echo "::error::verdict clear failed"; exit 1; } || true
          else
            echo "Wave-2 corrected re-score already applied ($RESCORE_MARK) — incremental scoring only."
          fi
          # 1. Score the catalog (loop until nothing left). After the one-time clear this
          #    re-scores the cleared activities with CORRECTED towns; on later deploys it is
          #    the cheap incremental pass (already-scored => scored=0 => breaks pass 1).
          for i in $(seq 1 40); do
            resp=$(curl -s -X POST "$PROD_URL/functions/v1/score-notability" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"limit":300}')
            scored=$(echo "$resp" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(String(JSON.parse(d).scored))}catch{process.stdout.write('ERR')}})")
            echo "score-notability pass $i: scored=$scored"
            if [ "$scored" = "ERR" ] || [ -z "$scored" ]; then echo "::error::score-notability failed: $resp"; exit 1; fi
            [ "$scored" = "0" ] && break
            sleep 2
          done
          # 2. Run the de-biased, distance-aware blend for ALL active regions (was Portland-
          #    only — why Warwick/Potsdam carousels never populated). One RPC loops them.
          code=$(curl -s -X POST "$PROD_URL/rest/v1/rpc/refresh_all_carousel_eligibility" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{}" -o /dev/null -w "%{http_code}")
          echo "blend all regions: HTTP $code"
          [ "$code" -ge 400 ] && { echo "::error::blend (all regions) failed"; exit 1; } || true
          # 3. Mark the one-time corrected re-score done so later deploys skip the clear.
          if [ -z "$RESCORE_MARK" ]; then
            curl -s -X POST "$MGMT" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"query\":\"insert into app_config(key,value) select 'wave2_corrected_rescore_done', now()::text where not exists (select 1 from app_config where key = 'wave2_corrected_rescore_done')\"}" \
              -o /dev/null
            echo "marked Wave-2 corrected re-score complete"
          fi
          echo "✅ Prod curation bootstrapped: catalog scored (corrected towns) + carousels blended."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (EAS needs node_modules to resolve config plugins)
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm ci

      # --- Client refresh: OTA-first, build ONLY when the fingerprint moves ---
      # Mirrors the staging flow (deploy-staging.yml). JS/display changes ride an OTA
      # to the `production` channel → NO EAS build (0 builds for a JS-only release,
      # holding the 22/mo cap). A full build fires ONLY when the runtime FINGERPRINT
      # changed (native code / deps / config) — detected by "no finished production
      # build exists for the OTA's runtime yet", so native changes can't slip out via
      # OTA. Runs AFTER the Production approval gate, so the OTA still ships only on
      # Kevin's deploy approval (it skips App Store *review*, not the deploy gate).
      - name: Publish OTA to production + decide if a build is needed
        id: ota
        if: ${{ env.EXPO_TOKEN != '' }}
        env:
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
        run: |
          # Bundle with the SAME production client env the EAS build uses
          # (eas.json build.production.env) + Mapbox from the secret, so eas update's
          # fingerprint matches the production build's runtime and the OTA actually
          # reaches installed builds. Clean CI env — no local .env, no contamination.
          eval "$(node -e 'const e=require("./eas.json").build.production.env||{};for(const[k,v]of Object.entries(e))console.log("export "+k+"="+JSON.stringify(String(v)))')"
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            *"$PROD_REF"*) echo "OTA env = production supabase ✓";;
            *) echo "::error::OTA env is not production ($EXPO_PUBLIC_SUPABASE_URL) — refusing to publish"; exit 1;;
          esac
          MSG=$(git log -1 --format='%s' | head -c 120)
          if ! npx eas-cli@latest update --branch production --platform ios --message "$MSG" --non-interactive --json > /tmp/ota.json 2> /tmp/ota.err; then
            echo "::error::eas update failed"; cat /tmp/ota.err; cat /tmp/ota.json; exit 1
          fi
          RT=$(node -e 'let j=require("/tmp/ota.json");const a=Array.isArray(j)?j:[j];const u=a.find(x=>x.platform==="ios"||x.runtimeVersion)||a[0];console.log((u&&u.runtimeVersion)||"")')
          echo "OTA published to production — iOS runtime: ${RT:-<unknown>}"
          # Need a build if we can't read the runtime (safe default) OR no finished
          # production build exists for it yet (fingerprint moved = native/deps/config).
          if [ -z "$RT" ]; then
            echo "::warning::could not read OTA runtime — building to be safe."
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          else
            HAS=$(npx eas-cli@latest build:list --platform ios --status finished --limit 30 --non-interactive --json 2>/dev/null | node -e 'let d="";const rt=process.argv[1];process.stdin.on("data",c=>d+=c).on("end",()=>{try{const b=JSON.parse(d);console.log(b.some(x=>x.buildProfile==="production"&&(((x.runtime&&x.runtime.version)===rt)||x.runtimeVersion===rt))?"yes":"no")}catch{console.log("no")}})' "$RT")
            if [ "$HAS" = "yes" ]; then
              echo "::notice::JS/display change — OTA only, NO EAS build (runtime $RT already has a production build)."
              echo "need_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Fingerprint changed (native/deps/config) — no production build on runtime $RT → building + store submission."
              echo "need_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Full build ONLY when the fingerprint moved (native/deps/config). Submission to
      # the App Store stays with submit-production.yml (unchanged).
      - name: Trigger EAS production build (fingerprint moved)
        if: ${{ env.EXPO_TOKEN != '' && steps.ota.outputs.need_build == 'true' }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait

      - name: Skip EAS (no token)
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "::warning::EXPO_TOKEN not set — skipped EAS production refresh."

      - name: Tag release
        id: tag
        run: |
          VERSION="v$(node -p "require('./package.json').version")-prod.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Production deploy $VERSION (${{ github.sha }})"
          git push origin "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Slack — deploy succeeded
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST -H 'Content-Type: application/json' "$SLACK_WEBHOOK_URL" -d @- <<JSON
          {"text":":white_check_mark: *Production deploy succeeded* — \`${{ steps.tag.outputs.version }}\`","attachments":[{"color":"#2eb886","blocks":[
            {"type":"section","fields":[
              {"type":"mrkdwn","text":"*Env:*\nproduction"},
              {"type":"mrkdwn","text":"*Release:*\n\`${{ steps.tag.outputs.version }}\`"},
              {"type":"mrkdwn","text":"*Commit:*\n\`${{ github.sha }}\`"},
              {"type":"mrkdwn","text":"*By:*\n${{ github.actor }}"},
              {"type":"mrkdwn","text":"*Shipped:*\nmigrations + edge functions + EAS"}
            ]},
            {"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View run"},"url":"$RUN_URL"}]}
          ]}]}
          JSON

  notify-failure:
    name: Slack on failure
    needs: [test, deploy]
    if: ${{ always() && (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_ALERT_MENTION: ${{ secrets.SLACK_ALERT_MENTION }}
    steps:
      - name: Slack — deploy failed
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE="${{ needs.test.result == 'failure' && 'tests' || 'deploy' }}"
          curl -sf -X POST -H 'Content-Type: application/json' "$SLACK_WEBHOOK_URL" -d @- <<JSON
          {"text":":rotating_light: *PRODUCTION deploy FAILED* at ${STAGE} ${SLACK_ALERT_MENTION}","attachments":[{"color":"#cc0000","blocks":[
            {"type":"section","fields":[
              {"type":"mrkdwn","text":"*Env:*\nproduction"},
              {"type":"mrkdwn","text":"*Failed at:*\n${STAGE}"},
              {"type":"mrkdwn","text":"*Commit:*\n\`${{ github.sha }}\`"}
            ]},
            {"type":"section","text":{"type":"mrkdwn","text":"Migrations are not auto-rolled-back. Follow the rollback runbook in docs/chief_engineer/deployment.md immediately."}},
            {"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View logs"},"url":"$RUN_URL"}]}
          ]}]}
          JSON
