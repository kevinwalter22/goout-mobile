name: Measure · Builder task (quota probe)

# One-shot harness for "what does one builder task cost against the weekly Max
# pool". Triggered by pushing a branch:
#   * measure/smoke — proves the toolchain (Expo web export + Playwright
#     screenshot) works in CI. Runs NO Claude → ZERO subscription quota.
#   * measure/run   — the real measurement: the official Claude Code CLI
#     (`claude -p`) implements a representative Tier-1/2 fix (QUALITY_AUDIT
#     F5/2b) and self-tests (typecheck + unit + web export + Playwright
#     screenshot). Runs on the Max SUBSCRIPTION via CLAUDE_CODE_OAUTH_TOKEN —
#     never ANTHROPIC_API_KEY. `--output-format json` yields exact tokens / cost
#     / turns, written to measure-artifacts/measurement.json.
#
# We use the CLI, not anthropics/claude-code-action, because that action rejects
# `push` events ("Unsupported event type: push"); the CLI runs on any trigger and
# is the same sanctioned subscription-auth path. The pool-% number is read from
# Kevin's /status meter bracketing the push; this run reports tokens/cost/turns +
# wall-clock + the diff.

on:
  push:
    branches: [measure/smoke, measure/run]

concurrency:
  group: measure-builder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_APP_ENV: staging
      EXPO_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_STAGING_PROJECT_REF }}.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Playwright chromium (deterministic, no quota)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Toolchain smoke — expo web export + screenshot
        id: smoke
        run: bash .github/scripts/measure_smoke.sh

      - name: Record start
        if: ${{ github.ref_name == 'measure/run' && steps.smoke.outcome == 'success' }}
        run: echo "MEASURE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Claude — implement F5/2b + self-test (SUBSCRIPTION, headless CLI)
        id: claude
        if: ${{ github.ref_name == 'measure/run' && steps.smoke.outcome == 'success' }}
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          unset ANTHROPIC_API_KEY   # never let an API key shadow the subscription token
          mkdir -p measure-artifacts
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version || { echo "claude CLI failed to install"; exit 1; }
          # Trust the workspace so Claude Code honors .claude/settings.json (allow + deny)
          # and does not stall on the trust dialog in headless mode.
          node -e "const fs=require('fs'),os=require('os'),p=require('path');const f=p.join(os.homedir(),'.claude.json');let j={};try{j=JSON.parse(fs.readFileSync(f,'utf8'))}catch{};j.projects=j.projects||{};j.projects[process.cwd()]=Object.assign({},j.projects[process.cwd()],{hasTrustDialogAccepted:true,hasCompletedProjectOnboarding:true});fs.writeFileSync(f,JSON.stringify(j));console.log('trusted',process.cwd())"
          PROMPT="$(cat .github/measure/task_f5_2b.md)"
          timeout 1500 claude -p "$PROMPT" \
            --model opus \
            --max-turns 60 \
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash" \
            --dangerously-skip-permissions \
            --output-format json \
            > measure-artifacts/claude-out.json 2> measure-artifacts/claude-err.log
          echo "claude exit code: $?"
          git --no-pager diff --stat > measure-artifacts/diff-stat.txt 2>&1 || true
          git --no-pager diff        > measure-artifacts/full.diff     2>&1 || true
          # Copy session transcripts so the report step can recover usage even if
          # the final JSON was not emitted.
          cp -r "$HOME/.claude/projects" measure-artifacts/claude-sessions 2>/dev/null || true
          echo "---- diff stat ----"; cat measure-artifacts/diff-stat.txt 2>/dev/null || true

      - name: Report measurement
        if: ${{ github.ref_name == 'measure/run' && always() }}
        run: |
          mkdir -p measure-artifacts
          node .github/measure/report.mjs

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ github.ref_name == 'measure/run' && 'run' || 'smoke' }}
          path: measure-artifacts/
          if-no-files-found: ignore
