name: Chief · Auditor (weekly)

# Phase A read-worker. Scores the catalog against the North Star (Level-1 item
# gate + Level-2 per-category scorecard) and reports the week-over-week
# curation-quality delta + "what to fix first" to #euda-chief. Report-only:
# contents:read, no commits, no PRs.
#
# Runs on Kevin's Max SUBSCRIPTION via CLAUDE_CODE_OAUTH_TOKEN — never alongside
# ANTHROPIC_API_KEY (which would shadow it into pay-per-token). Inert until both
# CLAUDE_CODE_OAUTH_TOKEN and SLACK_CHIEF_WEBHOOK_URL exist. GitHub runs
# scheduled workflows only from the default branch, so the weekly cron activates
# once this is merged to main; use "Run workflow" (workflow_dispatch) to test.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

concurrency:
  group: worker-auditor
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Heartbeat — start
        env:
          SLACK_CHIEF_WEBHOOK_URL: ${{ secrets.SLACK_CHIEF_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/worker_slack.mjs start auditor "Weekly curation-quality audit"

      - name: Gather health + curation scorecard (prod, read-only)
        env:
          REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
        run: bash .github/scripts/gather_audit_inputs.sh

      - name: Claude — write the chief audit report
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are Euda's weekly Quality Auditor — a read-only chief-engineer
            worker. You do not change code or data; you produce one report.

            READ FIRST:
            - data_quality_north_star.md — the standard you score against
              (Level-1 item gate: notability/completeness/accuracy; Level-2
              per-category scorecard: coverage/ranking/presentation/depth).
            - ./audit-inputs/*.json — already fetched for you:
              audit-curation-quality.json holds the deterministic scorecard as
              { current, previous } for a week-over-week delta;
              audit-posting-loop.json holds the posting-loop-health scorecard as
              { current, previous } (this 7-day window vs. the prior one — posts
              by route/link-type/verified-attendance + the started/completed
              funnel); the monitor-* and health-summary files add
              pipeline/budget/error signal. Some files may be missing or hold an
              HTTP/error note (e.g. audit-curation-quality and audit-posting-loop
              404 until the prod deploy lands) — say so plainly; never invent
              numbers.

            YOUR REPORT:
            1. Top-line movement: card-ready %, completeness, event freshness,
               notability confidence — current vs. previous snapshot (delta).
            2. Worst INTENTS per region. The scorecard is keyed to the 6 intents
               (get a bite / grab a drink / get outside / see something / what's
               happening / go play), scored against the LIVE system (carousel
               eligibility + blended notability + model_notability). Call out the
               lowest scorecard_pct / biggest regressions with the specific
               weakness: low eligible_pct, high pct_unscored (items the model
               never scored), weak notability distribution (notable/fine/unsure),
               low completeness, stale events, or a high `residue` (unmapped)
               count for the region.
            3. Notability sample (the part SQL can't do): judge ~5–8 items from
               weak categories against the North Star local-recommendation test;
               flag inventory-not-curation items and any stale/past events that
               slipped through. Keep the sample small — mind the turn budget.
            4. Fold in pipeline/budget/error signals a chief engineer should know.
            5. POSTING LOOP HEALTH (are people actually posting? — from
               audit-posting-loop.json). Report this week vs. last: total posts +
               distinct posters; the split by ROUTE (post_first FAB vs item_gated
               check-in) and by LINK-TYPE (linked-at-a-place vs My-Location);
               verified-at-event count; and the funnel (started vs completed →
               abandonment = started − completed, per route). Call out anything
               unhealthy: a route with ~0 posts (one path is undiscoverable or
               broken), abandonment climbing, verified-at-event collapsing
               (verification failing in the field), or completed ≫ posts /
               posts ≫ completed (an instrumentation or insert-error mismatch).
               If the numbers are tiny (early days), say "low volume — directional
               only" rather than over-reading noise.
            6. "What to fix first" — a short ranked list of concrete, high-leverage
               actions (these live in the report).
            7. PROPOSE TASKS (the self-maintaining loop): for your TOP 1–3
               highest-leverage, well-scoped fixes — from EITHER curation quality
               (items 1-3) OR posting-loop health (item 5; e.g. an unused/broken
               route, a verification failure pattern, or an instrumentation gap) —
               ALSO draft them as build tasks to ./proposed-tasks.json — a JSON array of:
                 { "title", "tier" (1-3), "priority" (1-100),
                   "spec": { "why", "change", "files":[...], "context":[...], "out_of_scope":[...] },
                   "acceptance": { "checks":[...] } }
               These enter a 'proposed' queue for KEVIN to approve into 'ready' —
               you NEVER queue ready work, and you cannot run the builder. Propose
               ONLY tasks that clear the spec bar (specific why/change/files/
               acceptance — no vague "improve the data"); skip the rest. Max 3.
               If nothing is concrete enough, write [] or omit the file.

            CONSTRAINTS:
            - Report-only on code/data. The ONLY files you may write are
              ./chief-report.md and ./proposed-tasks.json. Do not modify any other
              file, run a migration, or call any write endpoint — a separate keyed
              step turns proposed-tasks.json into 'proposed' rows (never 'ready').
            - coverage_pct is intentionally null (Level-3 reference sets aren't
              built yet) — note it as a known gap; don't try to compute it.
            - If you run low on turns, write what you have to ./chief-report.md
              and put "⚠️ hit turn cap — partial" at the top.

            OUTPUT: write the final Markdown report to ./chief-report.md — that
            file is what reaches Slack.
          claude_args: >-
            --model sonnet
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Write,Bash(cat:*),Bash(ls:*)"

      - name: Heartbeat — report or fail
        if: ${{ always() }}
        env:
          SLACK_CHIEF_WEBHOOK_URL: ${{ secrets.SLACK_CHIEF_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Make the report-vs-fail branch and the report size visible in the run
          # log — the claude step is continue-on-error, so a green run alone never
          # proves it produced output.
          if [ -f chief-report.md ]; then
            echo "::notice::auditor report produced ($(wc -c < chief-report.md) chars) — posting to Slack."
            node scripts/worker_slack.mjs report auditor chief-report.md
          else
            echo "::warning::auditor produced NO chief-report.md — posting the fallback notice (no real output)."
            node scripts/worker_slack.mjs fail auditor "No report produced — likely the weekly Max limit or an error. See the Actions run log; resumes next Monday."
          fi

      # Turn the auditor's drafted tasks into 'proposed' rows (Kevin approves →
      # 'ready'). Keyed step, NOT the Claude step — the DB key never touches Claude.
      # Server-side spec-gate + cap refuse anything vague; agents can't reach 'ready'.
      - name: Propose tasks from audit findings (keyed — not Claude)
        if: ${{ always() && hashFiles('proposed-tasks.json') != '' }}
        env:
          # Track A's QUEUE lives on PROD — the builder claims from prod (run_night.mjs
          # uses the prod ref). So the auditor proposes to the PROD queue: auditor scores
          # prod → proposes to prod → Kevin promotes on prod → builder builds from prod.
          # (Env vars keep the STG_ names the scripts read; they point at prod.)
          STG_URL: https://${{ secrets.SUPABASE_PROD_PROJECT_REF }}.supabase.co
          STG_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
          SLACK_CHIEF_WEBHOOK_URL: ${{ secrets.SLACK_CHIEF_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROPOSE_CAP: "3"
        run: node scripts/propose_tasks.mjs proposed-tasks.json auditor

      # Keep the produced report as a downloadable artifact — an audit trail so
      # "did it actually produce output?" is always answerable after the fact.
      - name: Upload report (audit trail)
        if: ${{ always() && hashFiles('chief-report.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: auditor-report
          path: chief-report.md
          if-no-files-found: warn
