name: Deploy to Staging

# On push to `staging`: run the full test gate, then (only if green) apply
# migrations + deploy edge functions + kick off an EAS staging build, and post a
# summary to Slack. On any failure, Slack gets an alert with a link to the run.
#
# Staging is fully isolated from prod, so there is no approval gate.
# Steps degrade gracefully: EAS / Slack steps no-op until EXPO_TOKEN /
# SLACK_WEBHOOK_URL are set, so the DB+functions deploy works incrementally.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Fast gate: reuse the PR test workflow but SKIP its integration job here
  # (run_integration: false). Integration runs later in `deploy`, AFTER `db push`,
  # so a behavior-changing migration and the test that asserts it can co-deploy.
  # secrets: inherit passes the staging secrets through.
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      run_integration: false

  deploy:
    name: Migrations + edge functions + EAS (staging)
    needs: [test]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Integration suite runs post-migration (see step below). Same secrets the
      # test.yml integration job uses; URL is derived from the staging ref.
      STAGING_SUPABASE_URL: https://${{ secrets.SUPABASE_STAGING_PROJECT_REF }}.supabase.co
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SENTRY_DSN_EDGE: ${{ secrets.SENTRY_DSN_EDGE }}
      # App Store Connect API key (.p8, base64) used to auto-submit the staging
      # build to TestFlight. The .p8 is gitignored, so CI reconstructs it from
      # this secret. When unset, the build still runs but submit is skipped.
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff the merged push range and decide whether
          # the mobile client changed (gates the EAS build below).
          fetch-depth: 0

      # Classify the merge to pick the cheapest correct client refresh:
      #   - bundle=false  → server/docs/CI only (edge functions, migrations,
      #                     scripts, docs). No OTA, no build.
      #   - bundle=true   → the app bundle changed. The OTA step below then decides
      #                     OTA-only (JS/display) vs a full EAS build (native/deps/
      #                     config that moves the fingerprint), so JS-only nights
      #                     cost ZERO EAS builds.
      # constants/ and hooks/ are bundled client code — a missed refresh is worse
      # than an extra one.
      - name: Classify change (does the app bundle change?)
        id: classify
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No reliable base ref (dispatch / first push) — treat as a bundle change."
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "::group::Changed files"; echo "$FILES"; echo "::endgroup::"
          if echo "$FILES" | grep -qE '^(app/|src/|components/|constants/|hooks/|lib/|assets/|plugins/|app\.json$|app\.config\.(js|ts)$|eas\.json$|package(-lock)?\.json$|patches/|babel\.config|metro\.config)'; then
            echo "App bundle changed → OTA (and a build only if the fingerprint moved)."
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "Server/docs-only merge → no OTA, no build."
            echo "bundle=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not "latest") — resolving "latest" hits the GitHub API and
          # gets rate-limited on shared runners. Bump deliberately.
          version: 2.76.9

      - name: Link staging project
        run: supabase link --project-ref "$STAGING_REF"

      - name: Apply pending migrations
        run: supabase db push

      - name: Deploy edge functions
        # `supabase functions deploy` bundles every function and fetches remote
        # esm.sh imports while doing so. esm.sh (Cloudflare) intermittently
        # returns 522/timeout mid-bundle, which fails the whole (non-atomic)
        # deploy after some functions already shipped. Retry up to 3× — re-runs
        # are cheap and idempotent ("No change found" skips unchanged functions).
        run: |
          for attempt in 1 2 3; do
            echo "::group::functions deploy attempt $attempt"
            if supabase functions deploy --project-ref "$STAGING_REF"; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "::warning::functions deploy attempt $attempt failed (likely transient esm.sh); retrying…"
            sleep 15
          done
          echo "::error::functions deploy failed after 3 attempts"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node_modules is needed both for the integration suite below and for EAS
      # to resolve config plugins — install once, unconditionally.
      - name: Install deps
        run: npm ci

      # Validate the NOW-migrated staging DB before shipping any client build.
      # This is the same suite the PR gate runs, but here it runs AFTER `db push`
      # (the PR gate runs it before). That ordering is the whole point: a
      # behavior-changing migration (e.g. 173's coords invariant) and the test
      # asserting its new behavior land together on staging without deadlocking.
      # A failure here fails the job and stops the EAS build below (forward-fix
      # policy: the migration stays applied; see the failure Slack note).
      - name: Integration tests (post-migration, vs staging)
        run: npm run test:integration

      # Reconstruct the App Store Connect API key (.p8) from the base64 secret so
      # `eas build --auto-submit` can hand it to EAS for the server-side TestFlight
      # submission. eas.json's submit.staging.ios.ascApiKeyPath points here.
      - name: Materialize App Store Connect API key
        if: ${{ env.EXPO_TOKEN != '' && env.ASC_API_KEY_P8_BASE64 != '' }}
        run: |
          mkdir -p secrets
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d > secrets/asc-api-key.p8
          echo "wrote secrets/asc-api-key.p8 ($(wc -c < secrets/asc-api-key.p8) bytes)"

      # --- Client refresh: OTA-first, build ONLY when the fingerprint moves ---
      # JS/display changes (most builder output) ride an OTA to the staging channel
      # → no EAS build, so a normal JS-only night costs ZERO builds. A full build
      # fires ONLY when the runtime fingerprint changed (native code / deps / config),
      # detected by "no finished staging build exists for the OTA's runtime yet."
      - name: Publish OTA to staging + decide if a build is needed
        id: ota
        if: ${{ env.EXPO_TOKEN != '' && steps.classify.outputs.bundle == 'true' }}
        env:
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
        run: |
          # Bundle with the SAME staging client env the EAS build uses
          # (eas.json build.staging.env) + Mapbox from the secret, so eas update's
          # fingerprint matches the staging build's runtime and the OTA actually
          # reaches installed builds. Clean CI env — no local .env, no contamination.
          eval "$(node -e 'const e=require("./eas.json").build.staging.env||{};for(const[k,v]of Object.entries(e))console.log("export "+k+"="+JSON.stringify(String(v)))')"
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            *"$STAGING_REF"*) echo "OTA env = staging supabase ✓";;
            *) echo "::error::OTA env is not staging ($EXPO_PUBLIC_SUPABASE_URL) — refusing to publish"; exit 1;;
          esac
          MSG=$(git log -1 --format='%s' | head -c 120)
          if ! npx eas-cli@latest update --branch staging --platform ios --message "$MSG" --non-interactive --json > /tmp/ota.json 2> /tmp/ota.err; then
            echo "::error::eas update failed"; cat /tmp/ota.err; cat /tmp/ota.json; exit 1
          fi
          RT=$(node -e 'let j=require("/tmp/ota.json");const a=Array.isArray(j)?j:[j];const u=a.find(x=>x.platform==="ios"||x.runtimeVersion)||a[0];console.log((u&&u.runtimeVersion)||"")')
          echo "OTA published to staging — iOS runtime: ${RT:-<unknown>}"
          # Need a build if we can't determine the runtime (safe default) OR no
          # finished staging build exists for it yet (fingerprint moved).
          if [ -z "$RT" ]; then
            echo "::warning::could not read OTA runtime — building to be safe."
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          else
            HAS=$(npx eas-cli@latest build:list --platform ios --status finished --limit 30 --non-interactive --json 2>/dev/null | node -e 'let d="";const rt=process.argv[1];process.stdin.on("data",c=>d+=c).on("end",()=>{try{const b=JSON.parse(d);console.log(b.some(x=>x.buildProfile==="staging"&&(((x.runtime&&x.runtime.version)===rt)||x.runtimeVersion===rt))?"yes":"no")}catch{console.log("no")}})' "$RT")
            if [ "$HAS" = "yes" ]; then
              echo "::notice::JS/display change — OTA only, NO EAS build (runtime $RT already has a staging build)."
              echo "need_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Fingerprint changed (native/deps/config) — no staging build on runtime $RT → building."
              echo "need_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Full build ONLY when the fingerprint moved. With the ASC key: build +
      # auto-submit to TestFlight (server-side; --no-wait is fine).
      - name: Trigger EAS staging build + TestFlight submit
        if: ${{ env.EXPO_TOKEN != '' && env.ASC_API_KEY_P8_BASE64 != '' && steps.ota.outputs.need_build == 'true' }}
        run: npx eas-cli@latest build --platform ios --profile staging --auto-submit --non-interactive --no-wait

      # Fallback: ASC key not configured — build only.
      - name: Trigger EAS staging build (build only — no ASC key)
        if: ${{ env.EXPO_TOKEN != '' && env.ASC_API_KEY_P8_BASE64 == '' && steps.ota.outputs.need_build == 'true' }}
        run: npx eas-cli@latest build --platform ios --profile staging --non-interactive --no-wait

      - name: Skip EAS (no token)
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "::warning::EXPO_TOKEN not set — skipped EAS staging refresh."

      # Server-only / doc-only merge: no client refresh at all. Tell Kevin so a
      # missing OTA/build never reads as "something went wrong."
      - name: No client refresh (server/docs-only) + Slack note
        if: ${{ env.EXPO_TOKEN != '' && steps.classify.outputs.bundle != 'true' }}
        run: |
          echo "::notice::Server/docs-only merge — no OTA, no build. Migrations + edge functions deployed normally."
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -sf -X POST -H 'Content-Type: application/json' "$SLACK_WEBHOOK_URL" -d @- <<JSON
          {"text":":information_source: *Staging: no client refresh*","attachments":[{"color":"#999999","blocks":[
            {"type":"section","text":{"type":"mrkdwn","text":"Server/docs-only merge — no app bundle change, so no OTA and no build. Migrations + edge functions deployed normally. Nothing went wrong."}},
            {"type":"section","fields":[
              {"type":"mrkdwn","text":"*Commit:*\n\`${{ github.sha }}\`"},
              {"type":"mrkdwn","text":"*By:*\n${{ github.actor }}"}
            ]},
            {"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View run"},"url":"$RUN_URL"}]}
          ]}]}
          JSON
          fi

      - name: Slack — deploy succeeded
        if: ${{ success() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.classify.outputs.bundle }}" != "true" ]; then
            SHIPPED="migrations + edge functions (no client change — no OTA/build)"
          elif [ "${{ steps.ota.outputs.need_build }}" = "true" ]; then
            SHIPPED="migrations + edge functions + OTA + EAS build (fingerprint changed)"
          else
            SHIPPED="migrations + edge functions + OTA (JS-only — no build)"
          fi
          curl -sf -X POST -H 'Content-Type: application/json' "$SLACK_WEBHOOK_URL" -d @- <<JSON
          {"text":":rocket: *Staging deploy succeeded*","attachments":[{"color":"#36a64f","blocks":[
            {"type":"section","fields":[
              {"type":"mrkdwn","text":"*Env:*\nstaging"},
              {"type":"mrkdwn","text":"*Commit:*\n\`${{ github.sha }}\`"},
              {"type":"mrkdwn","text":"*By:*\n${{ github.actor }}"},
              {"type":"mrkdwn","text":"*Shipped:*\n$SHIPPED"}
            ]},
            {"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View run"},"url":"$RUN_URL"}]}
          ]}]}
          JSON

  notify-failure:
    name: Slack on failure
    needs: [test, deploy]
    if: ${{ always() && (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_ALERT_MENTION: ${{ secrets.SLACK_ALERT_MENTION }}
    steps:
      - name: Slack — deploy failed
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STAGE="${{ needs.test.result == 'failure' && 'tests' || 'deploy' }}"
          curl -sf -X POST -H 'Content-Type: application/json' "$SLACK_WEBHOOK_URL" -d @- <<JSON
          {"text":":x: *Staging deploy FAILED* at ${STAGE} ${SLACK_ALERT_MENTION}","attachments":[{"color":"#cc0000","blocks":[
            {"type":"section","fields":[
              {"type":"mrkdwn","text":"*Env:*\nstaging"},
              {"type":"mrkdwn","text":"*Failed at:*\n${STAGE}"},
              {"type":"mrkdwn","text":"*Commit:*\n\`${{ github.sha }}\`"}
            ]},
            {"type":"section","text":{"type":"mrkdwn","text":"Migrations are not auto-rolled-back (forward-fix policy). See the rollback runbook in docs/chief_engineer/deployment.md."}},
            {"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View logs"},"url":"$RUN_URL"}]}
          ]}]}
          JSON
